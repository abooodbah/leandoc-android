name: Mutation check

# Run from the Actions tab or the API against a branch. Each mutation in the
# list is applied alone, the suite that should notice it runs, and the file is
# restored. The table is printed at the end of the log and on the summary page.

on:
  workflow_dispatch:
    inputs:
      list:
        description: Mutation list
        required: true
        default: mutations/manifest.json

permissions:
  contents: read

jobs:
  jvm:
    name: JVM mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build once
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Mutations
        run: python3 scripts/mutations.py "${{ inputs.list }}" jvm | tee mutations.md
      - name: Summary
        if: always()
        run: cat mutations.md | tee -a "$GITHUB_STEP_SUMMARY"

  device:
    name: Device mutations (API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Free disk space for the emulator
        # The emulator image, the AVD and the NDK do not fit next to every
        # preinstalled toolchain on the runner's disk.
        run: |
          df -h /
          ls "$ANDROID_HOME/ndk" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ "$(basename "$ndk")" = "28.2.13676358" ] || sudo rm -rf "$ndk"
          done
          df -h /


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build once
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Mutations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 scripts/mutations.py "${{ inputs.list }}" device | tee mutations.md
      - name: Summary
        if: always()
        run: cat mutations.md | tee -a "$GITHUB_STEP_SUMMARY"
