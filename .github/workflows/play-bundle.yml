name: Play bundle

# Builds the release bundle signed with the maintainer's upload key, for
# upload to Google Play. The key and its password come from repository
# secrets (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS);
# secrets are not given to workflows started from forks. Run it by hand from
# the Actions tab or the API with a tag. The bundle is kept as a workflow
# artifact for 7 days; it is not attached to the public release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: Signed bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "Secret for $name is not set"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Check the signer
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > signer.txt
          grep -E '^(Owner|Issuer|SHA256):' signer.txt
          if grep -q 'CN=Android Debug' signer.txt; then echo "Signed with the debug key"; exit 1; fi
          grep -q '^Owner:' signer.txt

      - name: Name and hash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab "play/LeanDoc-$version-play.aab"
          cd play
          sha256sum "LeanDoc-$version-play.aab" > "LeanDoc-$version-play.aab.sha256"
          ls -l

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: LeanDoc-${{ inputs.tag }}-play
          path: play/
          retention-days: 7

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
