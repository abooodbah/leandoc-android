name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each commit gets its own run, so a commit that only adds failing tests keeps
# its red result next to the fix that follows it.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, unit tests, release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Lint, unit tests, release APK and bundle
        run: ./gradlew --no-daemon -PdebugSignRelease lint testDebugUnitTest assembleRelease bundleRelease

      - name: Desktop core tests on the shipped copy of the core
        run: |
          cmake -S native-tests -B build/native-tests
          cmake --build build/native-tests --parallel
          ctest --test-dir build/native-tests --output-on-failure

      - name: Check the release APK requests no permissions
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          apk=app/build/outputs/apk/release/app-release.apk
          "$aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -q "uses-permission" permissions.txt; then
            echo "::error::The release APK requests a permission."
            exit 1
          fi

      - name: Report sizes
        run: |
          {
            echo "### Release sizes"
            echo
            echo "| File | Bytes |"
            echo "| --- | ---: |"
            for file in app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab; do
              echo "| $(basename "$file") | $(stat -c %s "$file") |"
            done
            echo
            echo "Largest entries in the release APK (compressed bytes):"
            echo
            echo '```'
            unzip -v app/build/outputs/apk/release/app-release.apk | awk 'NF >= 8 && $1 ~ /^[0-9]+$/ { print $3, $1, $8 }' | sort -rn | head -n 12
            echo '```'
          } | tee sizes.md >> "$GITHUB_STEP_SUMMARY"

      - name: What is in the APK
        run: |
          {
            echo "### Release APK contents"
            echo
            python3 scripts/apk-contents.py app/build/outputs/apk/release/app-release.apk
          } | tee contents.md >> "$GITHUB_STEP_SUMMARY"

      - name: Size on an arm64 phone
        # What Google Play builds from the bundle for one phone: bundletool's
        # own split APKs for an arm64-v8a, API 34, 420 dpi, English device.
        run: |
          curl -sSfL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en-US"],"screenDensity":420,"sdkVersion":34}' > arm64.json
          java -jar bundletool.jar build-apks --bundle=app/build/outputs/bundle/release/app-release.aab --output=arm64.apks --device-spec=arm64.json
          mkdir -p arm64
          java -jar bundletool.jar extract-apks --apks=arm64.apks --device-spec=arm64.json --output-dir=arm64
          {
            echo "### What Google Play delivers to an arm64 phone"
            echo
            echo "bundletool 1.17.2, device: arm64-v8a, API 34, 420 dpi, en-US."
            echo
            echo "| File | Bytes |"
            echo "| --- | ---: |"
            for apk in arm64/*.apk; do echo "| $(basename "$apk") | $(stat -c %s "$apk") |"; done
            echo "| **Installed APKs, total** | $(cat arm64/*.apk | wc -c) |"
            echo
            echo "Download size (bundletool get-size total):"
            echo
            echo '```'
            java -jar bundletool.jar get-size total --apks=arm64.apks --device-spec=arm64.json
            echo '```'
          } | tee arm64.md >> "$GITHUB_STEP_SUMMARY"

      - name: Native library breakdown
        run: |
          {
            echo "### arm64-v8a native library"
            echo
            bash scripts/native-sizes.sh
          } | tee native.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release build
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results

      - name: Summary
        if: always()
        run: |
          python3 scripts/ci-summary.py app/build/test-results
          cat permissions.txt sizes.md contents.md arm64.md native.md 2>/dev/null || true

  store-graphics:
    name: Google Play graphics
    # The icon, feature graphic and screenshots in store/ against Play's rules.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test the check
        run: python3 scripts/test_check_store_graphics.py

      - name: Check the graphics
        run: python3 scripts/check-store-graphics.py

  emulator:
    name: Emulator tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 26 is the minimum supported level, 34 a current one. The AOSP
        # "default" image for API 26 has no WebView, so that level uses the
        # Google APIs image, which has WebView 69.
        include:
          - api: 26
            target: google_apis
          - api: 34
            target: default
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        # The emulator image, the AVD and the NDK do not fit next to every
        # preinstalled toolchain on the runner's disk.
        run: |
          df -h /
          ls "$ANDROID_HOME/ndk" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ "$(basename "$ndk")" = "28.2.13676358" ] || sudo rm -rf "$ndk"
          done
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before the emulator starts, so its boot time is not spent compiling.
      - name: Build the app and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          cores: 4
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            df -h / && free -m
            adb shell dumpsys webviewupdate | grep -iE "current webview package|valid package" | tee webview.txt
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || { mkdir -p app/build/outputs/androidTest-results; adb logcat -d -v brief AndroidRuntime:E TestRunner:W LeanDocPage:D chromium:W '*:S' | tail -n 150 > app/build/outputs/androidTest-results/logcat.txt; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

      - name: Summary
        if: always()
        run: |
          cat webview.txt 2>/dev/null || true
          python3 scripts/ci-summary.py app/build/outputs/androidTest-results

  measure:
    name: Budgets on the emulator (API 34)
    # Compares this branch with the branch it merges into, on one emulator.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        # The emulator image, the AVD and the NDK do not fit next to every
        # preinstalled toolchain on the runner's disk.
        run: |
          df -h /
          ls "$ANDROID_HOME/ndk" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ "$(basename "$ndk")" = "28.2.13676358" ] || sudo rm -rf "$ndk"
          done
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build this branch
        run: |
          ./gradlew --no-daemon -PdebugSignRelease :app:assembleRelease :app:assembleDebugAndroidTest
          mkdir -p measure
          cp app/build/outputs/apk/release/app-release.apk measure/branch.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk measure/fixtures.apk
          ./gradlew --no-daemon :baseline:assembleRelease
          cp baseline/build/outputs/apk/release/baseline-release.apk measure/empty.apk

      - name: Build the base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if (cd ../base && ./gradlew --no-daemon -PdebugSignRelease assembleRelease); then
            cp ../base/app/build/outputs/apk/release/app-release.apk measure/base.apk
          else
            echo "The base branch does not build a release APK."
          fi

      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            df -h / && free -m
            adb install -r measure/fixtures.apk
            bash -c 'set -o pipefail; if [ -f measure/base.apk ]; then base="base=measure/base.apk"; fi; scripts/measure.sh empty=measure/empty.apk $base branch=measure/branch.apk | tee measure/results.md'

      - name: Summary
        if: always()
        run: |
          echo "Emulator: API 34 AOSP image, x86_64, pixel_6 profile, 4 cores, SwiftShader graphics." | tee -a "$GITHUB_STEP_SUMMARY"
          cat measure/results.md | tee -a "$GITHUB_STEP_SUMMARY" || true

  screenshots:
    name: Store screenshots (${{ matrix.theme }})
    # Only for pull requests from store branches. Each image is attached to
    # check runs on the pull request's head commit as base64 parts, because
    # artifacts cannot be fetched from where the maintainer reviews this.
    # scripts/fetch-screenshots.sh puts them back together.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'store')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        # The emulator image, the AVD and the NDK do not fit next to every
        # preinstalled toolchain on the runner's disk.
        run: |
          df -h /
          ls "$ANDROID_HOME/ndk" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ "$(basename "$ndk")" = "28.2.13676358" ] || sudo rm -rf "$ndk"
          done
          df -h /


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test file provider
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          # 1080 x 1920: Google Play wants phone screenshots no longer than 2:1.
          profile: pixel_2
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: scripts/screenshots.sh ${{ matrix.theme }}

      - name: Attach the screenshots to check runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for shot in screenshots/*.png; do
            [ -f "$shot" ] || continue
            name=$(basename "$shot")
            sum=$(sha256sum "$shot" | cut -d' ' -f1)
            echo "$name $(stat -c %s "$shot") bytes, sha256 $sum"
            rm -f part.*
            base64 -w0 "$shot" | split -b 60000 -d -a 2 - part.
            count=$(ls part.* | wc -l)
            index=0
            for part in part.*; do
              index=$((index + 1))
              gh api "repos/$GITHUB_REPOSITORY/check-runs" --silent \
                -f name="screenshot $name $index/$count" -f head_sha="$HEAD_SHA" \
                -f status=completed -f conclusion=neutral \
                -f "output[title]=$name part $index of $count" \
                -f "output[summary]=sha256 $sum" \
                -F "output[text]=@$part"
            done
          done
